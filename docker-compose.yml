# Runs the whole app:  docker compose up --build
#   UI      -> http://localhost:5003
#   API     -> http://localhost:5025/swagger
#   SQL     -> localhost,1433  (user: sa)
#
# Host ports match launchSettings.json. Inside Docker the UI server reaches the
# API by its service name (ApiBaseUrl=http://api:8080), not through localhost.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Asset_Mgmt2026!}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql      # keeps the data when containers are recreated
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: assetmanagement-api
    build:
      context: .
      dockerfile: AssetManagement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables Swagger
      ConnectionStrings__Default: "Server=db,1433;Database=AssetManagement;User Id=sa;Password=${SA_PASSWORD:-Asset_Mgmt2026!};TrustServerCertificate=True"
      ApplyMigrationsOnStartup: "true"      # creates the database/tables on first run
    ports:
      - "5025:8080"
    depends_on:
      db:
        condition: service_healthy

  ui:
    image: assetmanagement-ui
    build:
      context: .
      dockerfile: AssetManagement.UI/Dockerfile
    environment:
      ApiBaseUrl: "http://api:8080"         # the UI server calls the API over the compose network
    ports:
      - "5003:8080"
    depends_on:
      - api

volumes:
  sqldata:
