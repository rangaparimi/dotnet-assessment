# Runs the whole app:  docker compose up --build
#   UI      -> http://localhost:5003
#   API     -> http://localhost:5025/swagger
#   SQL     -> localhost,1433  (user: sa)
#
# All settings and secrets come from the .env file next to this one
# (copy .env.example to .env first). No passwords are written here.
#
# Inside Docker the UI server reaches the API by its service name
# (ApiBaseUrl=http://api:8080), not through localhost.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?SA_PASSWORD is missing - copy .env.example to .env and set it}"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql      # keeps the data when containers are recreated
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: assetmanagement-api
    build:
      context: .
      dockerfile: AssetManagement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__Default: "Server=db,1433;Database=AssetManagement;User Id=sa;Password=${SA_PASSWORD:?SA_PASSWORD is missing};TrustServerCertificate=True"
      ApplyMigrationsOnStartup: "${APPLY_MIGRATIONS_ON_STARTUP:-false}"
      ApiKey: "${API_KEY:?API_KEY is missing - set it in .env}"
    ports:
      - "${API_PORT:-5025}:8080"
    depends_on:
      db:
        condition: service_healthy

  ui:
    image: assetmanagement-ui
    build:
      context: .
      dockerfile: AssetManagement.UI/Dockerfile
    environment:
      ApiBaseUrl: "http://api:8080"         # container-to-container address, not a secret
      ApiKey: "${API_KEY:?API_KEY is missing - set it in .env}"
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is missing - see README 'Sign-in setup'}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is missing - see README 'Sign-in setup'}"
      Auth__AdminEmails: "${ADMIN_EMAILS:-}"
    ports:
      - "${UI_PORT:-5003}:8080"
    depends_on:
      - api

volumes:
  sqldata:
